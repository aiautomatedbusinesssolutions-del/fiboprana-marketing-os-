{% extends "base.html" %}
{% block title %}TikTok post generation error — Fiboprana Marketing{% endblock %}
{% block content %}
    <div class="page-header">
        <h1>Couldn't generate TikTok posts</h1>
        <div class="actions">
            {% if observation %}
                <a class="button-link" href="{{ url_for('observations.observations_detail', obs_id=observation.id) }}">← Back to observation</a>
                <form method="post" action="{{ url_for('content.generate_tiktok_posts') }}">
                    <input type="hidden" name="observation_id" value="{{ observation.id }}">
                    <button type="submit" class="button-secondary">Try again</button>
                </form>
            {% else %}
                <a class="button-link" href="{{ url_for('observations.observations_list') }}">← Back to observations</a>
            {% endif %}
        </div>
    </div>

    <div class="notice notice-error">
        <strong>Error:</strong> {{ error }}
    </div>
{% endblock %}
